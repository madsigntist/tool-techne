<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}}</title>
  <style>
    :root {
      --bg: #f7f7f5;
      --surface: #ffffff;
      --text: #1d1d1b;
      --muted: #5f5f5a;
      --line: #d9d9d4;
      --accent: #2456c9;
      --accent-text: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #161615;
        --surface: #20201e;
        --text: #ececea;
        --muted: #a3a39d;
        --line: #3a3a37;
        --accent: #7aa2ff;
        --accent-text: #0d0d0c;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 1rem/1.5 system-ui, sans-serif;
    }
    .page { max-width: 48rem; margin: 0 auto; padding: 2rem 1rem; }
    .page__title { font-size: clamp(1.5rem, 1.3rem + 1vw, 2.25rem); margin: 0 0 0.5rem; }
    .page__lead { color: var(--muted); margin: 0 0 1.5rem; }
    .page__card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 0.5rem;
      padding: 1rem;
    }
    .page__btn {
      font: inherit;
      padding: 0.5rem 1rem;
      border-radius: 0.375rem;
      border: 1px solid var(--accent);
      background: var(--accent);
      color: var(--accent-text);
      cursor: pointer;
    }
    .page__btn:hover { filter: brightness(1.1); color: var(--accent-text); }
    .page__btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <main class="page">
    <h1 class="page__title">{{TITLE}}</h1>
    <p class="page__lead">{{PURPOSE}}</p>

    <section class="page__card" aria-labelledby="start-h">
      <h2 id="start-h">Start here</h2>
      <p>This page works. Ask your AI assistant to build the first feature here.</p>
      <button class="page__btn" id="hello" type="button">Try the button</button>
      <p id="status" role="status"></p>
    </section>
  </main>

  <script>
    (function () {
      'use strict';

      document.getElementById('hello').addEventListener('click', () => {
        document.getElementById('status').textContent = `Clicked at ${new Date().toLocaleTimeString()}.`;
      });
    })();
  </script>
</body>
</html>
